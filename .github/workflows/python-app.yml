name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本號 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # 必須要有寫入權限才能建立 Release

jobs:
  build:
    strategy:
      matrix:
        # 一次跑兩台機器：Windows 和 M1 Mac
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          activate-environment: "true"

      - name: Install Dependencies
        shell: bash
        run: |
          uv pip install --upgrade pip
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          fi

      - name: Build with Nuitka
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv run python -m nuitka \
            --standalone \
            --windows-console-mode=disable \
            --enable-plugin=pyside6 \
            --nofollow-import-to=PySide6.QtWebEngine,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.QtQml,PySide6.QtQuick,PySide6.QtQuickWidgets,PySide6.QtQuickControls2,PySide6.QtMultimedia,PySide6.QtMultimediaWidgets,PySide6.QtNetwork,PySide6.QtWebSockets,PySide6.QtWebChannel,PySide6.QtSql,PySide6.QtSerialPort,PySide6.QtBluetooth,PySide6.QtNfc,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtLocation,PySide6.QtCharts,PySide6.QtDataVisualization,PySide6.Qt3DCore,PySide6.Qt3DInput,PySide6.Qt3DLogic,PySide6.Qt3DRender,PySide6.QtDesigner,PySide6.QtHelp,PySide6.QtTest,PySide6.QtXml,PySide6.QtRemoteObjects,PySide6.QtScxml,PySide6.QtStateMachine,PySide6.QtPrintSupport,PySide6.QtSvg \
            --windows-icon-from-ico=icon.ico \
            --include-data-files=icon.ico=icon.ico \
            --assume-yes-for-downloads \
            --output-dir=build \
            main.py
          
          else
            uv run python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --enable-plugin=pyside6 \
            --macos-app-icon=icon.png \
            --nofollow-import-to=PySide6.QtWebEngine,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.QtQml,PySide6.QtQuick,PySide6.QtQuickWidgets,PySide6.QtQuickControls2,PySide6.QtMultimedia,PySide6.QtMultimediaWidgets,PySide6.QtNetwork,PySide6.QtWebSockets,PySide6.QtWebChannel,PySide6.QtSql,PySide6.QtSerialPort,PySide6.QtBluetooth,PySide6.QtNfc,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtLocation,PySide6.QtCharts,PySide6.QtDataVisualization,PySide6.Qt3DCore,PySide6.Qt3DInput,PySide6.Qt3DLogic,PySide6.Qt3DRender,PySide6.QtDesigner,PySide6.QtHelp,PySide6.QtTest,PySide6.QtXml,PySide6.QtRemoteObjects,PySide6.QtScxml,PySide6.QtStateMachine,PySide6.QtPrintSupport,PySide6.QtSvg \
            --include-data-files=icon.png=icon.png \
            --assume-yes-for-downloads \
            --output-dir=build \
            main.py
          fi

      - name: Prepare Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "build/main.dist") {
            Compress-Archive -Path "build/main.dist" -DestinationPath "stocks_windows.zip" -Force
            Write-Host "Successfully zipped main.dist to stocks_windows.zip"
          } else {
            Write-Error "Error: build/main.dist not found!"
            Get-ChildItem -Path build -Recurse
            exit 1
          }

      # --- 針對 macOS 的處理：壓縮 ---
      - name: Prepare macOS Artifact (Zip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "build/main.app" ]; then
            cd build && zip -r ../stocks_macos.zip main.app
            echo "Successfully zipped main.app to stocks_macos.zip"
          else
            echo "Error: build/main.app not found!"
            ls -R build
            exit 1
          fi

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          # 這裡使用萬用字元，確保只上傳當前平台產出的檔案
          files: stocks_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}