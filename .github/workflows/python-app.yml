name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本號 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # 必須要有寫入權限才能建立 Release

jobs:
  build:
    strategy:
      matrix:
        # 一次跑兩台機器：Windows 和 M1 Mac
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          activate-environment: "true"

      - name: Install Dependencies
        shell: bash
        run: |
          uv pip install --upgrade pip
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          fi

      - name: Build with Nuitka
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv run python -m nuitka \
            --standalone \
            --windows-console-mode=disable \
            --enable-plugin=pyside6 \
            --noinclude-qt-translations \
            --nofollow-import-to=PySide6.QtWebEngine \
            --nofollow-import-to=PySide6.QtWebEngineCore \
            --nofollow-import-to=PySide6.QtWebEngineWidgets \
            --nofollow-import-to=PySide6.QtQml \
            --nofollow-import-to=PySide6.QtQuick \
            --nofollow-import-to=PySide6.QtQuickWidgets \
            --nofollow-import-to=PySide6.QtQuickControls2 \
            --nofollow-import-to=PySide6.QtMultimedia \
            --nofollow-import-to=PySide6.QtMultimediaWidgets \
            --nofollow-import-to=PySide6.QtNetwork \
            --nofollow-import-to=PySide6.QtWebSockets \
            --nofollow-import-to=PySide6.QtWebChannel \
            --nofollow-import-to=PySide6.QtSql \
            --nofollow-import-to=PySide6.QtSerialPort \
            --nofollow-import-to=PySide6.QtBluetooth \
            --nofollow-import-to=PySide6.QtNfc \
            --nofollow-import-to=PySide6.QtSensors \
            --nofollow-import-to=PySide6.QtPositioning \
            --nofollow-import-to=PySide6.QtLocation \
            --nofollow-import-to=PySide6.QtCharts \
            --nofollow-import-to=PySide6.QtDataVisualization \
            --nofollow-import-to=PySide6.Qt3DCore \
            --nofollow-import-to=PySide6.Qt3DInput \
            --nofollow-import-to=PySide6.Qt3DLogic \
            --nofollow-import-to=PySide6.Qt3DRender \
            --nofollow-import-to=PySide6.QtDesigner \
            --nofollow-import-to=PySide6.QtHelp \
            --nofollow-import-to=PySide6.QtTest \
            --nofollow-import-to=PySide6.QtXml \
            --nofollow-import-to=PySide6.QtRemoteObjects \
            --nofollow-import-to=PySide6.QtScxml \
            --nofollow-import-to=PySide6.QtStateMachine \
            --nofollow-import-to=PySide6.QtPrintSupport \
            --nofollow-import-to=PySide6.QtSvg \
            --nofollow-import-to=PySide6.QtOpenGL \
            --nofollow-import-to=PySide6.QtOpenGLWidgets \
            --nofollow-import-to=PySide6.QtPdf \
            --nofollow-import-to=PySide6.QtPdfWidgets \
            --nofollow-import-to=PySide6.QtTextToSpeech \
            --nofollow-import-to=PySide6.QtSpatialAudio \
            --nofollow-import-to=PySide6.QtUiTools \
            --nofollow-import-to=PySide6.QtDBus \
            --nofollow-import-to=unittest \
            --nofollow-import-to=doctest \
            --nofollow-import-to=pydoc \
            --nofollow-import-to=tkinter \
            --windows-icon-from-ico=icon.ico \
            --include-data-files=icon.ico=icon.ico \
            --assume-yes-for-downloads \
            --output-dir=build \
            main.py
          
          else
            uv run python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --enable-plugin=pyside6 \
            --macos-app-icon=icon.png \
            --noinclude-qt-translations \
            --nofollow-import-to=PySide6.QtWebEngine \
            --nofollow-import-to=PySide6.QtWebEngineCore \
            --nofollow-import-to=PySide6.QtWebEngineWidgets \
            --nofollow-import-to=PySide6.QtQml \
            --nofollow-import-to=PySide6.QtQuick \
            --nofollow-import-to=PySide6.QtQuickWidgets \
            --nofollow-import-to=PySide6.QtQuickControls2 \
            --nofollow-import-to=PySide6.QtMultimedia \
            --nofollow-import-to=PySide6.QtMultimediaWidgets \
            --nofollow-import-to=PySide6.QtNetwork \
            --nofollow-import-to=PySide6.QtWebSockets \
            --nofollow-import-to=PySide6.QtWebChannel \
            --nofollow-import-to=PySide6.QtSql \
            --nofollow-import-to=PySide6.QtSerialPort \
            --nofollow-import-to=PySide6.QtBluetooth \
            --nofollow-import-to=PySide6.QtNfc \
            --nofollow-import-to=PySide6.QtSensors \
            --nofollow-import-to=PySide6.QtPositioning \
            --nofollow-import-to=PySide6.QtLocation \
            --nofollow-import-to=PySide6.QtCharts \
            --nofollow-import-to=PySide6.QtDataVisualization \
            --nofollow-import-to=PySide6.Qt3DCore \
            --nofollow-import-to=PySide6.Qt3DInput \
            --nofollow-import-to=PySide6.Qt3DLogic \
            --nofollow-import-to=PySide6.Qt3DRender \
            --nofollow-import-to=PySide6.QtDesigner \
            --nofollow-import-to=PySide6.QtHelp \
            --nofollow-import-to=PySide6.QtTest \
            --nofollow-import-to=PySide6.QtXml \
            --nofollow-import-to=PySide6.QtRemoteObjects \
            --nofollow-import-to=PySide6.QtScxml \
            --nofollow-import-to=PySide6.QtStateMachine \
            --nofollow-import-to=PySide6.QtPrintSupport \
            --nofollow-import-to=PySide6.QtSvg \
            --nofollow-import-to=PySide6.QtOpenGL \
            --nofollow-import-to=PySide6.QtOpenGLWidgets \
            --nofollow-import-to=PySide6.QtPdf \
            --nofollow-import-to=PySide6.QtPdfWidgets \
            --nofollow-import-to=PySide6.QtTextToSpeech \
            --nofollow-import-to=PySide6.QtSpatialAudio \
            --nofollow-import-to=PySide6.QtUiTools \
            --nofollow-import-to=PySide6.QtDBus \
            --nofollow-import-to=unittest \
            --nofollow-import-to=doctest \
            --nofollow-import-to=pydoc \
            --nofollow-import-to=tkinter \
            --include-data-files=icon.png=icon.png \
            --assume-yes-for-downloads \
            --output-dir=build \
            main.py
          fi

      - name: Prepare Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "build/main.dist") {
            Compress-Archive -Path "build/main.dist" -DestinationPath "stocks_windows.zip" -Force
            Write-Host "Successfully zipped main.dist to stocks_windows.zip"
          } else {
            Write-Error "Error: build/main.dist not found!"
            Get-ChildItem -Path build -Recurse
            exit 1
          }

      # --- 針對 macOS 的處理：壓縮 ---
      - name: Prepare macOS Artifact (Zip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "build/main.app" ]; then
            cd build && zip -r ../stocks_macos.zip main.app
            echo "Successfully zipped main.app to stocks_macos.zip"
          else
            echo "Error: build/main.app not found!"
            ls -R build
            exit 1
          fi

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          # 這裡使用萬用字元，確保只上傳當前平台產出的檔案
          files: stocks_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}